name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.3)"
        required: true
        default: "v0.1.2"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Read package version
        id: version
        run: |
          VERSION=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release

      - name: Generate shell completions
        run: |
          mkdir -p completions
          for shell in bash elvish fish powershell zsh; do
            ./target/release/colorctl completions "$shell" > "completions/colorctl.$shell"
          done
          # Provide standard zsh filename convention
          cp completions/colorctl.zsh completions/_colorctl

      - name: Package archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p staging dist
          cp target/release/colorctl staging/
          cp -r completions staging/
          tar -czf "dist/colorctl-${VERSION}-linux-x86_64.tar.gz" -C staging colorctl completions
          tar -czf "dist/colorctl-${VERSION}-completions.tar.gz" -C . completions

      - name: Build Debian package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH=$(dpkg --print-architecture)
          cargo deb --no-build
          cp target/debian/*.deb "dist/colorctl-${VERSION}-linux-${ARCH}.deb"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: colorctl
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Determine tag
        id: release_info
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract tag message
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          git fetch --tags --force
          # Use subject + body (instead of %(contents)) to exclude any PGP signature block.
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > TAG_BODY.md || true
          echo "---- Tag message for $TAG ----"
          cat TAG_BODY.md || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: colorctl ${{ steps.release_info.outputs.tag }}
          body_path: TAG_BODY.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
