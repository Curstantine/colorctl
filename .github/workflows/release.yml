name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Read package version
        id: version
        run: |
          VERSION=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release

      - name: Generate shell completions
        run: |
          mkdir -p completions
          for shell in bash elvish fish powershell zsh; do
            ./target/release/colorctl completions "$shell" > "completions/colorctl.$shell"
          done
          # Provide standard zsh filename convention
          cp completions/colorctl.zsh completions/_colorctl

      - name: Package archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp target/release/colorctl dist/
          cp -r completions dist/
          tar -czf "colorctl-${VERSION}-linux-x86_64.tar.gz" -C dist colorctl completions
          tar -czf "colorctl-${VERSION}-completions.tar.gz" completions

      - name: Build Debian package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH=$(dpkg --print-architecture)
          cargo deb --no-build
          cp target/debian/*.deb "dist/colorctl-${VERSION}-linux-${ARCH}.deb"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: colorctl-${{ steps.version.outputs.version }}
          path: |
            colorctl-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            colorctl-${{ steps.version.outputs.version }}-completions.tar.gz
            dist/*.deb

      - name: Determine tag
        id: release_info
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract tag message
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          git fetch --tags --force
          # Use subject + body (instead of %(contents)) to exclude any PGP signature block.
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > TAG_BODY.md || true
          echo "---- Tag message for $TAG ----"
          cat TAG_BODY.md || true

      - name: Attach assets to GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'release'
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          body_path: TAG_BODY.md
          generate_release_notes: false
          files: |
            colorctl-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            colorctl-${{ steps.version.outputs.version }}-completions.tar.gz
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
